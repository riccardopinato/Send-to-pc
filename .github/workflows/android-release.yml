name: Android release

on:
  push:
    branches:
      - "store-candidate/**"
  workflow_dispatch:
    inputs:
      store_candidate:
        description: "Require production AdMob IDs and build a Store candidate"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-bisect-v117-no-init
  cancel-in-progress: true

env:
  EXPECTED_UPLOAD_CERT_SHA256: 248AE3BEDEC1CA6F80B2272F0ACDE5F010987864B4F5754FE2FA499353D77CE4
  STORE_CANDIDATE: ${{ github.event_name == 'push' || inputs.store_candidate }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Unable to resolve versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Resolved v$VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Require persistent signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Require production AdMob IDs for Store candidate
        if: ${{ env.STORE_CANDIDATE == 'true' }}
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Store candidate requires production AdMob IDs: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{10,20}~[0-9]{5,20}$ ]]; then
            echo "::error::ADMOB_APP_ID has an invalid format"
            exit 1
          fi

          for pair in \
            "ADMOB_BANNER_ID:$ADMOB_BANNER_ID" \
            "ADMOB_INTERSTITIAL_ID:$ADMOB_INTERSTITIAL_ID"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [[ ! "$value" =~ ^ca-app-pub-[0-9]{10,20}/[0-9]{5,20}$ ]]; then
              echo "::error::$name has an invalid format"
              exit 1
            fi
          done

          if [ "$ADMOB_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ] || \
             [ "$ADMOB_BANNER_ID" = "ca-app-pub-3940256099942544/9214589741" ] || \
             [ "$ADMOB_INTERSTITIAL_ID" = "ca-app-pub-3940256099942544/1033173712" ]; then
            echo "::error::Store candidate cannot use Google demo AdMob IDs"
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          chmod 600 .signing/release.jks

      - name: Test and lint
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew lintRelease --stacktrace

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signing and collect identity
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          mkdir -p build/release-artifacts
          cp "$APK" "build/release-artifacts/Send-to-PC-v${VERSION_NAME}.apk"
          cp "$AAB" "build/release-artifacts/Send-to-PC-v${VERSION_NAME}.aab"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            > build/release-artifacts/SIGNING.txt

          ACTUAL_CERT_SHA256=$(
            awk -F': ' '
              /Signer #1 certificate SHA-256 digest:/ {
                print toupper($2)
                exit
              }
            ' build/release-artifacts/SIGNING.txt
          )

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Unable to read APK signing certificate fingerprint"
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate"
            echo "Expected: $EXPECTED_UPLOAD_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          sha256sum \
            "build/release-artifacts/Send-to-PC-v${VERSION_NAME}.apk" \
            "build/release-artifacts/Send-to-PC-v${VERSION_NAME}.aab" \
            > build/release-artifacts/SHA256SUMS.txt

          {
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "package_id=com.riccardopinato.inviaalpc"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "store_candidate=${STORE_CANDIDATE}"
            if [ -n "${ADMOB_APP_ID:-}" ] && [ -n "${ADMOB_BANNER_ID:-}" ] && [ -n "${ADMOB_INTERSTITIAL_ID:-}" ]; then
              echo "admob_production_configured=true"

              {
                printf 'app_id_sha256='
                printf '%s' "$ADMOB_APP_ID" | sha256sum | awk '{print $1}'
                printf 'banner_id_sha256='
                printf '%s' "$ADMOB_BANNER_ID" | sha256sum | awk '{print $1}'
                printf 'interstitial_id_sha256='
                printf '%s' "$ADMOB_INTERSTITIAL_ID" | sha256sum | awk '{print $1}'
              } > build/release-artifacts/ADMOB_IDENTITY.txt
            else
              echo "admob_production_configured=false"
              printf '%s\n' "production_admob_not_configured"                 > build/release-artifacts/ADMOB_IDENTITY.txt
            fi
            echo "expected_upload_certificate_sha256=$EXPECTED_UPLOAD_CERT_SHA256"
            echo "actual_upload_certificate_sha256=$ACTUAL_CERT_SHA256"
          } > build/release-artifacts/RELEASE_IDENTITY.txt

          cat build/release-artifacts/SIGNING.txt
          cat build/release-artifacts/SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Send-to-PC-v${{ env.VERSION_NAME }}-apk
          path: build/release-artifacts/Send-to-PC-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Send-to-PC-v${{ env.VERSION_NAME }}-aab
          path: build/release-artifacts/Send-to-PC-v${{ env.VERSION_NAME }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Send-to-PC-v${{ env.VERSION_NAME }}-release-evidence
          path: |
            build/release-artifacts/SHA256SUMS.txt
            build/release-artifacts/SIGNING.txt
            build/release-artifacts/RELEASE_IDENTITY.txt
            build/release-artifacts/ADMOB_IDENTITY.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -rf .signing
