name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  EXPECTED_UPLOAD_CERT_SHA256: 248AE3BEDEC1CA6F80B2272F0ACDE5F010987864B4F5754FE2FA499353D77CE4

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Require persistent signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          chmod 600 .signing/release.jks

      - name: Test and lint
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew lintRelease --stacktrace

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signing and collect identity
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          mkdir -p build/release-artifacts
          cp "$APK" build/release-artifacts/Invia-al-PC-v1.17.0.apk
          cp "$AAB" build/release-artifacts/Invia-al-PC-v1.17.0.aab

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            > build/release-artifacts/SIGNING.txt

          ACTUAL_CERT_SHA256=$(
            awk -F': ' '
              /Signer #1 certificate SHA-256 digest:/ {
                print toupper($2)
                exit
              }
            ' build/release-artifacts/SIGNING.txt
          )

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Unable to read APK signing certificate fingerprint"
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate"
            echo "Expected: $EXPECTED_UPLOAD_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          sha256sum \
            build/release-artifacts/Invia-al-PC-v1.17.0.apk \
            build/release-artifacts/Invia-al-PC-v1.17.0.aab \
            > build/release-artifacts/SHA256SUMS.txt

          {
            echo "source_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "package_id=com.riccardopinato.inviaalpc"
            echo "version_name=1.17.0"
            echo "version_code=28"
            if [ -n "${ADMOB_APP_ID:-}" ] && [ -n "${ADMOB_BANNER_ID:-}" ] && [ -n "${ADMOB_INTERSTITIAL_ID:-}" ]; then
              echo "admob_production_configured=true"
            else
              echo "admob_production_configured=false"
            fi
            echo "expected_upload_certificate_sha256=$EXPECTED_UPLOAD_CERT_SHA256"
            echo "actual_upload_certificate_sha256=$ACTUAL_CERT_SHA256"
          } > build/release-artifacts/RELEASE_IDENTITY.txt

          cat build/release-artifacts/SIGNING.txt
          cat build/release-artifacts/SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Invia-al-PC-v1.17.0-apk
          path: build/release-artifacts/Invia-al-PC-v1.17.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Invia-al-PC-v1.17.0-aab
          path: build/release-artifacts/Invia-al-PC-v1.17.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Invia-al-PC-v1.17.0-release-evidence
          path: |
            build/release-artifacts/SHA256SUMS.txt
            build/release-artifacts/SIGNING.txt
            build/release-artifacts/RELEASE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -rf .signing
