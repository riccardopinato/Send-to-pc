name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintSlim --stacktrace

      - name: Build slim APK
        run: gradle assembleSlim --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/slim/app-slim.apk

      - name: Show APK size and checksum
        run: |
          ls -lh app/build/outputs/apk/slim/app-slim.apk
          du -h app/build/outputs/apk/slim/app-slim.apk
          sha256sum app/build/outputs/apk/slim/app-slim.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Invia-al-PC-v1.10.0
          path: app/build/outputs/apk/slim/app-slim.apk
          if-no-files-found: error
          retention-days: 30
