name: AppLab exact APK certification v1.27.6

on:
  push:
    branches:
      - diagnostic/applab-v1274-legacy

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pinned AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: 0030bf7eb45101a37ae93432b98d9551c34b93fa
          path: applab
          persist-credentials: false

      - name: Download exact v1.27.6 Store Candidate APK
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/riccardopinato/Send-to-pc/actions/artifacts/11860925710/zip" \
            --output artifact.zip
          mkdir -p exact-apk
          unzip -q artifact.zip -d exact-apk
          test -f exact-apk/Send-to-PC-v1.27.6.apk
          echo "5f36b5d4a1127a2a789bb0d3fb60394b3acf72a98c297987ee09878c69c4aaea  exact-apk/Send-to-PC-v1.27.6.apk" | sha256sum -c -

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        timeout-minutes: 1
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run exact APK through pinned AppLab offline
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APPLAB_RUN_MAESTRO: "false"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable || true
            bash -lc 'cd "$GITHUB_WORKSPACE/applab" && chmod +x scripts/*.sh && RUN_MAESTRO=false REPORT_DIR="$GITHUB_WORKSPACE/applab/applab-report" ./scripts/verify_apk.sh "$GITHUB_WORKSPACE/exact-apk/Send-to-PC-v1.27.6.apk" "com.riccardopinato.inviaalpc"'

      - name: Upload AppLab diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-v1.27.6-exact-apk-report
          path: applab/applab-report/
          if-no-files-found: warn
          retention-days: 7
