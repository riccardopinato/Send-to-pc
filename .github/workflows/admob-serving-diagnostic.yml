name: AdMob serving diagnostic v1.27.5

on:
  push:
    branches:
      - diagnostic/admob-v1275-serving
    paths:
      - ".github/workflows/admob-serving-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serving:
    name: serving-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            force_eea: "false"
          - mode: forced-eea
            force_eea: "true"

    steps:
      - name: Checkout Send to PC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pinned AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: riccardopinato/AppLab
          ref: 0030bf7eb45101a37ae93432b98d9551c34b93fa
          path: applab
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          chmod 600 .signing/release.jks

      - name: Build signed diagnostic release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ca-app-pub-3940256099942544/9214589741
          ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/1033173712
          ADMOB_DIAGNOSTIC_FORCE_EEA: ${{ matrix.force_eea }}
        run: |
          set -Eeuo pipefail
          ./gradlew assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run production App ID with Google test ad units
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            bash "$GITHUB_WORKSPACE/.github/scripts/admob_diagnostic.sh" "${{ matrix.mode }}" "${{ matrix.force_eea }}"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: admob-v1275-${{ matrix.mode }}
          path: admob-report/${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        run: rm -rf .signing
